<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>桌面 — dsh-server-login</title>
    <link rel="icon" href="/logo.svg" />
    <link rel="stylesheet" href="/design.css" />
  </head>
  <body>
    <div class="desktop">
      <div class="wallpaper"></div>

      <div class="topbar">
        <div class="brand">
          <img class="logo" src="/logo.svg" alt="DeepSeek" />

 3.264-1.843 5.223-1.843s3.938.481 5.222 1.843c1.296 1.36 1.756 3.434 1.756 5.497zM78.635 18.315c-1.284.806-3.263 1.089-5.222 1.089-1.958 0-3.917-.294-5.212-1.09-1.295-.795-1.755-2.03-1.755-3.246h3.767c0 .472.225.953.824 1.257.6.304 1.54.419 2.462.419.92 0 1.851-.115 2.46-.42.611-.303.825-.784.825-1.256 0-.47-.214-.952-.824-1.256-.61-.304-1.627-.419-2.547-.419-1.777 0-3.563-.293-4.73-1.09-1.167-.795-1.584-2.03-1.584-3.245 0-1.215.417-2.44 1.584-3.246 1.167-.807 2.953-1.09 4.73-1.09 1.776 0 3.564.294 4.73 1.09 1.167.795 1.584 2.031 1.584 3.246h-3.264c0-.471-.203-.942-.749-1.257-.546-.303-1.391-.419-2.226-.419s-1.68.105-2.226.42c-.556.303-.75.785-.75 1.256 0 .47.204.942.75 1.256.545.304 1.316.42 2.151.42 1.959 0 3.938.292 5.222 1.088 1.295.796 1.756 2.032 1.756 3.246 0 1.215-.471 2.44-1.756 3.247zM96.507 12.063v1.141h-8.55v-2.272h5.672c-.129-.827-.429-1.602-.963-2.167-.771-.817-1.959-1.11-3.136-1.11s-2.366.293-3.136 1.11c-.77.816-1.048 2.063-1.048 3.298 0 1.236.278 2.492 1.048 3.299.77.806 1.959 1.11 3.135 1.11 1.178 0 2.366-.294 3.137-1.11.106-.116.203-.241.3-.367h3.167c-.279.985-.717 1.874-1.38 2.566-1.284 1.35-3.265 1.843-5.224 1.843-1.957 0-3.938-.482-5.222-1.843-1.284-1.362-1.754-3.435-1.754-5.498s.46-4.147 1.754-5.497c1.296-1.351 3.265-1.843 5.222-1.843 1.96 0 3.94.481 5.224 1.843 1.294 1.36 1.754 3.434 1.754 5.497zM112.624 13.204v-1.14c0-2.064-.46-4.137-1.754-5.498-1.285-1.362-3.265-1.843-5.223-1.843-1.959 0-3.928.492-5.222 1.843-1.296 1.35-1.756 3.434-1.756 5.497 0 2.063.471 4.136 1.756 5.498 1.284 1.36 3.263 1.843 5.222 1.843 1.958 0 3.938-.493 5.223-1.843.663-.692 1.102-1.582 1.38-2.566h-3.168l-.012.016c-.093.12-.185.24-.288.35-.77.817-1.957 1.11-3.135 1.11-1.177 0-2.365-.303-3.136-1.11-.77-.806-1.049-2.062-1.049-3.298 0-1.236.279-2.482 1.049-3.298.771-.817 1.959-1.11 3.136-1.11 1.178 0 2.365.293 3.135 1.11.536.565.836 1.34.964 2.167h-5.672v2.272h8.55zM128.73 19.404l-5.264-7.78 5.264-6.252h-3.97l-5.265 6.251 5.265 7.78h3.97z"/></svg></span>
        </div>
        <div class="right">
          <span class="role hidden" id="roleBadge"></span>
          <span class="who" id="who"></span>
          <button class="btn ghost small logout" id="logoutBtn">退出</button>
        </div>
      </div>

      <div class="desk-path">
        <button class="btn ghost small back" id="backBtn">← 返回</button>
        <span class="loc" id="deskPath">我的桌面 / 根目录</span>
      </div>

      <div class="icons">
        <div class="desk-icon" data-open="dsh">
          <div class="tile dsh"><img src="/deepseek.webp" alt="DSH" /></div>
          <span class="label">DSH</span>
        </div>
        <div class="desk-icon" data-app="upload">
          <div class="tile files"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0l-4 4m4-4l4 4"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg></div>
          <span class="label">上传文件</span>
        </div>
        <div class="desk-icon" data-app="newfile">
          <div class="tile file"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 12v5M9.5 14.5h5"/></svg></div>
          <span class="label">新建文件</span>
        </div>
        <div class="desk-icon" data-open="files">
          <div class="tile files"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 3h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></div>
          <span class="label">我的文件</span>
        </div>
        <div class="desk-icon hidden" id="adminIcon" data-open="admin">
          <div class="tile admin"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z"/><path d="M9 12l2 2 4-4"/></svg></div>
          <span class="label">管理台</span>
        </div>
        <div class="desk-divider"></div>
        <div id="fileIcons"></div>
      </div>

      <div class="taskbar">
        <div class="app" data-open="dsh"><img src="/deepseek.webp" style="width:24px;height:24px;border-radius:6px" alt="DSH" /></div>
        <div class="app" data-app="upload"><svg viewBox="0 0 24 24" fill="none" stroke="#cfe0ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0l-4 4m4-4l4 4"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg></div>
        <div class="app" data-app="newfile"><svg viewBox="0 0 24 24" fill="none" stroke="#cfe0ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 12v5M9.5 14.5h5"/></svg></div>
        <div class="app" data-open="files"><svg viewBox="0 0 24 24" fill="none" stroke="#cfe0ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 3h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></div>
        <div class="app hidden" id="adminTask" data-open="admin"><svg viewBox="0 0 24 24" fill="none" stroke="#cfe0ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z"/></svg></div>
        <span class="clock" id="clock"></span>
      </div>
    </div>

    <!-- 新建文件对话框 -->
    <div id="newFileDialog" class="hidden" style="position:fixed;inset:0;display:grid;place-items:center;background:rgba(4,9,22,0.55);z-index:200">
      <div style="background:#fff;border-radius:14px;padding:20px;width:320px;box-shadow:var(--shadow)">
        <h3 style="margin:0 0 14px">新建文件</h3>
        <div class="field"><label>名称</label><input id="nfName" placeholder="例如 notes.md 或 我的项目" /></div>
        <div class="field"><label>类型</label>
          <select id="nfType" style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font-size:14px">
            <option value="file">文件</option>
            <option value="dir">文件夹</option>
          </select>
        </div>
        <div class="row-actions" style="margin-top:16px">
          <button class="btn primary" id="nfOk">创建</button>
          <button class="btn ghost" id="nfCancel">取消</button>
        </div>
      </div>
    </div>

    <input id="fileInput" type="file" class="hidden" />

    <!-- ============ 窗口：DSH ============ -->
    <div class="window hidden" id="win-dsh">
      <div class="window-title">
        <div class="t"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>DSH</div>
        <div class="controls"><button class="close" onclick="closeWindow('dsh')">✕</button></div>
      </div>
      <div class="window-body">
        <div class="stat" id="dshState"><span class="dot off"></span> 未运行</div>
        <div class="row-actions">
          <button class="btn primary" id="launchBtn">启动 DSH</button>
          <button class="btn ghost hidden" id="stopBtn">停止</button>
          <button class="btn ghost hidden" id="openDshBtn">打开 DSH ↗</button>
          <button class="btn ghost" id="managePluginsBtn">管理插件</button>
          <button class="btn ghost" id="manageKeysBtn">管理密钥</button>
        </div>
        <div class="section-label">在此文件夹启动：<span id="dshFolder">根目录</span></div>
        <div class="hidden" id="pluginPanel">
          <div class="section-label">当前文件夹插件</div>
          <div id="pluginList"></div>
          <button class="btn primary small" id="savePluginsBtn" style="margin-top:10px">保存插件选择</button>
        </div>
        <div class="hidden" id="keyPanel">
          <div class="section-label">我的 API 密钥（选中的用于你的 DSH）</div>
          <div id="keyList"></div>
          <div class="section-label">新增密钥</div>
          <div class="row-actions">
            <input id="keyNameInput" placeholder="名称（如 家用 / 服务器）" autocomplete="off" style="flex:1;min-width:90px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-size:13px;color:var(--ink)" />
            <input id="keyValueInput" type="password" placeholder="sk-..." autocomplete="off" style="flex:1.4;min-width:130px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-size:13px;color:var(--ink)" />
            <button class="btn primary small" id="addKeyBtn">添加</button>
          </div>
        </div>
      </div>
      <div class="resize" title="拖动缩放"></div>
    </div>

    <!-- ============ 窗口：我的文件 ============ -->
    <div class="window hidden" id="win-files">
      <div class="window-title">
        <div class="t"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 3h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>我的文件</div>
        <div class="controls"><button class="close" onclick="closeWindow('files')">✕</button></div>
      </div>
      <div class="window-body">
        <div class="pathbar">
          <button class="btn ghost small" id="newFolderBtn">新建文件夹</button>
          <span class="crumbs" id="breadcrumb"></span>
        </div>
        <table class="files">
          <thead><tr><th>名称</th><th>类型</th><th>大小</th><th>修改时间</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="resize" title="拖动缩放"></div>
    </div>

    <!-- ============ 窗口：管理台 ============ -->
    <div class="window hidden" id="win-admin">
      <div class="window-title">
        <div class="t"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z"/></svg>管理台</div>
        <div class="controls"><button class="close" onclick="closeWindow('admin')">✕</button></div>
      </div>
      <div class="window-body">
        <div class="section-label">用户审核与管理</div>
        <table class="admin" id="adminUsers">
          <thead><tr><th>用户名</th><th>角色</th><th>注册时间</th><th>操作</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="resize" title="拖动缩放"></div>
    </div>

    <script>
      // ---------- session ----------
      let user = null
      async function me() {
        const res = await fetch('/api/auth/me')
        if (!res.ok) return null
        return (await res.json()).user
      }

      // ---------- window manager ----------
      const zTop = { n: 10 }
      function openWindow(id) {
        const win = document.getElementById('win-' + id)
        if (!win) return
        if (win.classList.contains('hidden')) { win.classList.remove('hidden'); positionWindow(win) }
        focusWindow(win)
      }
      function closeWindow(id) {
        const win = document.getElementById('win-' + id)
        if (win) win.classList.add('hidden')
      }
      function focusWindow(win) {
        document.querySelectorAll('.window').forEach((w) => w.classList.remove('focused'))
        win.classList.add('focused')
        win.style.zIndex = ++zTop.n
      }
      function saveWindowState(win) {
        try {
          localStorage.setItem('dsh-win-' + win.id, JSON.stringify({
            left: win.offsetLeft, top: win.offsetTop, width: win.offsetWidth, height: win.offsetHeight,
          }))
        } catch { /* storage unavailable — ignore */ }
      }
      function loadWindowState(id) {
        try { return JSON.parse(localStorage.getItem('dsh-win-' + id) || 'null') } catch { return null }
      }
      function positionWindow(win) {
        if (win.dataset.placed) return
        win.dataset.placed = '1'
        const saved = loadWindowState(win.id)
        if (saved && saved.width && saved.height) {
          win.style.left = saved.left + 'px'; win.style.top = saved.top + 'px'
          win.style.width = saved.width + 'px'; win.style.height = saved.height + 'px'
        } else {
          win.style.left = Math.round((innerWidth - 620) / 2 + (Math.random() * 40 - 20)) + 'px'
          win.style.top = Math.round((innerHeight - 460) / 2 + (Math.random() * 40 - 20)) + 'px'
        }
      }
      // Touch devices: windows are full-screen (CSS), so no drag/resize needed.
      const TOUCH = window.matchMedia('(pointer: coarse)').matches
      if (!TOUCH) {
        document.querySelectorAll('.window-title').forEach((bar) => {
          bar.addEventListener('pointerdown', (e) => {
            const win = bar.closest('.window')
            focusWindow(win)
            if (e.target.closest('button')) return
            const sx = e.clientX, sy = e.clientY, l = win.offsetLeft, t = win.offsetTop
            const move = (ev) => { win.style.left = l + (ev.clientX - sx) + 'px'; win.style.top = t + (ev.clientY - sy) + 'px' }
            const up = () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); saveWindowState(win) }
            window.addEventListener('pointermove', move)
            window.addEventListener('pointerup', up)
          })
        })
      }
      document.querySelectorAll('.window').forEach((w) => w.addEventListener('pointerdown', () => focusWindow(w)))
      // resize from any edge/corner
      const MIN_W = 380, MIN_H = 240
      function startResize(win, e, dir) {
        e.stopPropagation()
        focusWindow(win)
        const sx = e.clientX, sy = e.clientY
        const r = win.getBoundingClientRect()
        const start = { left: r.left, top: r.top, width: win.offsetWidth, height: win.offsetHeight }
        const L = dir.includes('w'), R = dir.includes('e'), T = dir.includes('n'), B = dir.includes('s')
        const move = (ev) => {
          const dx = ev.clientX - sx, dy = ev.clientY - sy
          let left = start.left, top = start.top, width = start.width, height = start.height
          if (R) width = Math.max(MIN_W, start.width + dx)
          if (L) { width = Math.max(MIN_W, start.width - dx); left = start.left + (start.width - width) }
          if (B) height = Math.max(MIN_H, start.height + dy)
          if (T) { height = Math.max(MIN_H, start.height - dy); top = start.top + (start.height - height) }
          win.style.left = left + 'px'; win.style.top = top + 'px'
          win.style.width = width + 'px'; win.style.height = height + 'px'
        }
        const up = () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); saveWindowState(win) }
        window.addEventListener('pointermove', move)
        window.addEventListener('pointerup', up)
      }
      if (!TOUCH) {
        document.querySelectorAll('.window').forEach((win) => {
          for (const d of ['n', 's', 'e', 'w', 'ne', 'nw', 'sw']) {
            const h = document.createElement('div')
            h.className = 'rz rz-' + d
            h.title = '拖动缩放'
            h.addEventListener('pointerdown', (e) => startResize(win, e, d))
            win.appendChild(h)
          }
        })
        document.querySelectorAll('.window .resize').forEach((rz) => {
          rz.addEventListener('pointerdown', (e) => startResize(rz.closest('.window'), e, 'se'))
        })
      }
      // open apps (single click) + taskbar
      document.querySelectorAll('[data-open]').forEach((el) => el.addEventListener('click', () => openWindow(el.dataset.open)))
      document.querySelectorAll('[data-app]').forEach((el) => el.addEventListener('click', () => appAction(el.dataset.app)))

      // ---------- current folder (shared) ----------
      let currentPath = []
      function pathString() { return currentPath.join('/') }
      function deskPathLabel() { return currentPath.length ? '我的桌面 / ' + currentPath.join(' / ') : '我的桌面 / 根目录' }

      // ---------- desktop file grid ----------
      const fileIcons = document.getElementById('fileIcons')
      async function renderDesktop() {
        const p = pathString()
        document.getElementById('deskPath').textContent = deskPathLabel()
        document.getElementById('backBtn').classList.toggle('hidden', currentPath.length === 0)
        const res = await fetch('/api/desktop/tree' + (p ? '?path=' + encodeURIComponent(p) : ''))
        const body = await res.json()
        fileIcons.innerHTML = ''
        for (const e of body.entries || []) {
          const icon = document.createElement('div')
          icon.className = 'desk-icon'
          icon.dataset.entry = e.type
          icon.dataset.path = encodeURIComponent(p ? p + '/' + e.name : e.name)
          const tile = e.type === 'dir'
            ? '<div class="tile files"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 3h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></div>'
            : '<div class="tile file"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg></div>'
          icon.innerHTML = tile + '<span class="label">' + e.name + '</span>'
          fileIcons.appendChild(icon)
        }
        fileIcons.querySelectorAll('.desk-icon').forEach((icon) => {
          icon.addEventListener('dblclick', () => {
            if (icon.dataset.entry === 'dir') {
              currentPath = decodeURIComponent(icon.dataset.path).split('/').filter(Boolean)
              syncAll()
            }
          })
        })
      }

      // ---------- sync desktop + files window + DSH folder ----------
      async function syncAll() {
        document.getElementById('dshFolder').textContent = pathString() || '根目录'
        await Promise.all([renderDesktop(), load()])
      }
      async function navigate(path) {
        currentPath = path ? path.split('/').filter(Boolean) : []
        await syncAll()
      }
      document.getElementById('backBtn').addEventListener('click', () => {
        currentPath = currentPath.slice(0, -1)
        syncAll()
      })

      // ---------- files window (table) ----------
      const rows = document.getElementById('rows')
      const breadcrumb = document.getElementById('breadcrumb')
      function fmtSize(bytes) { if (!bytes) return '—'; const u = ['B','KB','MB','GB']; let i = 0, n = bytes; while (n >= 1024 && i < u.length - 1) { n /= 1024; i++ } return `${n.toFixed(i ? 1 : 0)} ${u[i]}` }
      function renderBreadcrumb() {
        const parts = ['<span class="crumb" data-path="">根</span>']
        let acc = []
        for (const seg of currentPath) { acc.push(seg); parts.push('<span class="sep">/</span><span class="crumb" data-path="' + acc.join('/') + '">' + seg + '</span>') }
        breadcrumb.innerHTML = parts.join('')
        breadcrumb.querySelectorAll('.crumb').forEach((c) => c.addEventListener('click', () => navigate(c.dataset.path)))
      }
      async function load() {
        const p = pathString()
        const res = await fetch('/api/desktop/tree' + (p ? '?path=' + encodeURIComponent(p) : ''))
        const body = await res.json()
        rows.innerHTML = ''
        if (p) rows.insertAdjacentHTML('beforeend', '<tr><td class="dir" data-up="1">..</td><td></td><td></td><td></td></tr>')
        for (const e of body.entries || []) {
          const href = e.type === 'dir' ? ' class="dir" data-path="' + encodeURIComponent(p ? p + '/' + e.name : e.name) + '"' : ''
          rows.insertAdjacentHTML('beforeend', `<tr><td${href}>${e.name}</td><td>${e.type === 'dir' ? '文件夹' : '文件'}</td><td>${fmtSize(e.size)}</td><td>${new Date(e.mtimeMs).toLocaleString()}</td></tr>`)
        }
        renderBreadcrumb()
        rows.querySelectorAll('.dir[data-path]').forEach((el) => el.addEventListener('click', () => navigate(decodeURIComponent(el.dataset.path))))
        const up = rows.querySelector('.dir[data-up]')
        if (up) up.addEventListener('click', () => { currentPath = currentPath.slice(0, -1); syncAll() })
      }

      // ---------- upload / new file ----------
      async function fsApi(path, options) {
        const res = await fetch(path, { ...options, headers: { 'content-type': 'application/json' } })
        if (!res.ok) { alert('操作失败：' + ((await res.json().catch(() => ({}))).error || res.status)); return null }
        return res.json()
      }
      function appAction(app) {
        if (app === 'upload') document.getElementById('fileInput').click()
        if (app === 'newfile') {
          document.getElementById('newFileDialog').classList.remove('hidden')
          document.getElementById('nfName').value = ''
          document.getElementById('nfName').focus()
        }
      }
      document.getElementById('fileInput').addEventListener('change', async (event) => {
        const file = event.target.files[0]
        if (!file) return
        const data = await new Promise((resolve, reject) => {
          const reader = new FileReader()
          reader.onload = () => resolve(reader.result.split(',')[1])
          reader.onerror = reject
          reader.readAsDataURL(file)
        })
        await fsApi('/api/fs/upload', { method: 'POST', body: JSON.stringify({ path: pathString(), name: file.name, data }) })
        event.target.value = ''
        syncAll()
      })
      document.getElementById('nfOk').addEventListener('click', async () => {
        const name = document.getElementById('nfName').value.trim()
        const type = document.getElementById('nfType').value
        if (!name) { alert('请输入名称'); return }
        await fsApi('/api/fs/create', { method: 'POST', body: JSON.stringify({ path: pathString(), name, type }) })
        document.getElementById('newFileDialog').classList.add('hidden')
        syncAll()
      })
      document.getElementById('nfCancel').addEventListener('click', () => document.getElementById('newFileDialog').classList.add('hidden'))

      // ---------- DSH window ----------
      async function refreshDsh() {
        const res = await fetch('/api/dsh/status')
        if (!res.ok) return
        const body = await res.json()
        const running = body.running
        document.getElementById('dshState').innerHTML = `<span class="dot ${running ? 'on' : 'off'}"></span> ${running ? '运行中' : '未运行'}`
        document.getElementById('stopBtn').classList.toggle('hidden', !running)
        document.getElementById('openDshBtn').classList.toggle('hidden', !running)
        if (running) document.getElementById('openDshBtn').onclick = () => window.open(body.url, '_blank')
      }
      document.getElementById('launchBtn').addEventListener('click', async () => {
        const res = await fetch('/api/dsh/launch', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ folder: pathString() }) })
        if (!res.ok) { const b = await res.json().catch(() => ({})); alert(b.error === 'already_running' ? '已有运行中的 DSH，请先停止' : '启动失败'); return }
        await refreshDsh()
      })
      document.getElementById('stopBtn').addEventListener('click', async () => { await fetch('/api/dsh/stop', { method: 'POST' }); await refreshDsh() })

      // API key vault
      async function loadKeys() {
        const res = await fetch('/api/me/keys')
        if (!res.ok) return
        const { keys } = await res.json()
        const list = document.getElementById('keyList')
        list.innerHTML = ''
        if (keys.length === 0) {
          list.innerHTML = '<p style="font-size:13px;color:var(--ink-soft)">暂无密钥。添加后你的 DSH 才能调用模型。</p>'
        }
        for (const k of keys) {
          const row = document.createElement('div')
          row.className = 'plugin-item'
          const dot = `<span class="dot ${k.enabled ? 'on' : 'off'}"></span>`
          const act = k.enabled
            ? '<span style="font-size:12px;color:var(--ok)">启用中</span>'
            : `<button class="btn small ghost" data-sel="${k.id}">启用</button>`
          row.innerHTML = `${dot} <strong>${k.name}</strong> <span style="flex:1"></span> ${act} <button class="btn small danger" data-del="${k.id}" style="margin-left:6px">删除</button>`
          list.appendChild(row)
        }
        list.querySelectorAll('[data-sel]').forEach((b) => b.addEventListener('click', async () => {
          await fetch(`/api/me/keys/${b.dataset.sel}/select`, { method: 'POST' })
          await loadKeys()
        }))
        list.querySelectorAll('[data-del]').forEach((b) => b.addEventListener('click', async () => {
          if (!confirm('删除这个密钥？')) return
          await fetch(`/api/me/keys/${b.dataset.del}`, { method: 'DELETE' })
          await loadKeys()
        }))
      }
      document.getElementById('manageKeysBtn').addEventListener('click', async () => {
        const panel = document.getElementById('keyPanel')
        panel.classList.toggle('hidden')
        if (!panel.classList.contains('hidden')) await loadKeys()
      })
      document.getElementById('addKeyBtn').addEventListener('click', async () => {
        const name = document.getElementById('keyNameInput').value.trim()
        const apiKey = document.getElementById('keyValueInput').value.trim()
        if (!name || !apiKey) { alert('请填名称和密钥'); return }
        const res = await fetch('/api/me/keys', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name, apiKey }) })
        if (!res.ok) { alert('名称或密钥格式无效'); return }
        document.getElementById('keyNameInput').value = ''
        document.getElementById('keyValueInput').value = ''
        await loadKeys()
      })

      let pluginCatalog = []
      async function loadPlugins() {
        const folder = pathString()
        const res = await fetch('/api/plugins' + (folder ? '?folder=' + encodeURIComponent(folder) : ''))
        if (!res.ok) return
        const { plugins } = await res.json()
        pluginCatalog = plugins
        const list = document.getElementById('pluginList')
        list.innerHTML = plugins.length === 0 ? '<p>暂无可用插件</p>' : ''
        for (const plugin of plugins) {
          const label = document.createElement('label')
          label.className = 'plugin-item'
          label.innerHTML = `<input type="checkbox" data-id="${plugin.id}" ${plugin.enabled ? 'checked' : ''}/> <strong>${plugin.name}</strong> — ${plugin.description || ''}`
          list.appendChild(label)
        }
      }
      document.getElementById('managePluginsBtn').addEventListener('click', async () => {
        const panel = document.getElementById('pluginPanel')
        panel.classList.toggle('hidden')
        if (!panel.classList.contains('hidden')) await loadPlugins()
      })
      document.getElementById('savePluginsBtn').addEventListener('click', async () => {
        const plugins = pluginCatalog.map((p) => ({ id: p.id, enabled: document.querySelector(`input[data-id="${p.id}"]`).checked }))
        const res = await fetch('/api/plugins/select', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ folder: pathString(), plugins }) })
        if (res.ok) alert('已保存')
      })

      // ---------- admin ----------
      async function loadUsers() {
        const res = await fetch('/api/admin/users')
        const { users } = await res.json()
        const tbody = document.querySelector('#adminUsers tbody')
        tbody.innerHTML = ''
        const badge = { admin: '管理员', pending: '待审核', active: '正常', disabled: '已禁用' }
        for (const u of users) {
          const actions = u.role === 'pending'
            ? `<button class="btn small ghost" data-act="approve" data-id="${u.id}">通过</button>`
            : u.role === 'active' ? `<button class="btn small danger" data-act="disable" data-id="${u.id}">禁用</button>`
            : u.role === 'disabled' ? `<button class="btn small ghost" data-act="enable" data-id="${u.id}">恢复</button>` : ''
          tbody.insertAdjacentHTML('beforeend', `<tr><td>${u.username}</td><td><span class="badge ${u.role}">${badge[u.role] || u.role}</span></td><td>${new Date(u.createdAt).toLocaleString()}</td><td>${actions}</td></tr>`)
        }
        tbody.onclick = async (event) => {
          const btn = event.target.closest('button[data-act]')
          if (!btn) return
          const { act, id } = btn.dataset
          const res = await fetch(`/api/admin/users/${id}/${act}`, { method: 'POST' })
          if (res.ok) await loadUsers()
          else alert('操作失败')
        }
      }

      // ---------- clock ----------
      function tick() { document.getElementById('clock').textContent = new Date().toLocaleString('zh-CN', { hour12: false }) }

      // ---------- init ----------
      document.getElementById('logoutBtn').addEventListener('click', async () => { await fetch('/api/auth/logout', { method: 'POST' }); location.href = '/login.html' })
      tick(); setInterval(tick, 1000)

      ;(async function init() {
        user = await me()
        if (!user) { location.href = '/login.html'; return }
        document.getElementById('who').textContent = user.username
        const roleLabel = user.role === 'admin' ? '管理员' : user.role === 'pending' ? '待审核' : '正常'
        document.getElementById('roleBadge').textContent = roleLabel
        document.getElementById('roleBadge').classList.remove('hidden')
        if (user.role === 'admin') {
          document.getElementById('adminIcon').classList.remove('hidden')
          document.getElementById('adminTask').classList.remove('hidden')
          await loadUsers()
        }
        await syncAll()
        await refreshDsh()
      })()
    </script>
  </body>
</html>
