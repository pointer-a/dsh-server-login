<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登录 — dsh-server-login</title>
    <style>
      :root { color-scheme: light dark; }
      body { font-family: system-ui, sans-serif; max-width: 22rem; margin: 4rem auto; padding: 0 1rem; }
      label { display: block; margin: 1rem 0 0.25rem; }
      input { width: 100%; padding: 0.5rem; box-sizing: border-box; }
      button { width: 100%; margin-top: 1.25rem; padding: 0.6rem; }
      #msg { color: #c0392b; min-height: 1.2em; }
      a { color: inherit; }
    </style>
  </head>
  <body>
    <h1>登录</h1>
    <form id="login">
      <label for="username">用户名</label>
      <input id="username" name="username" autocomplete="username" required />
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <button type="submit">登录</button>
    </form>
    <p id="msg"></p>
    <p>还没有账号？<a href="/register.html">注册</a></p>
    <script>
      const form = document.getElementById('login')
      const msg = document.getElementById('msg')
      form.addEventListener('submit', async (event) => {
        event.preventDefault()
        msg.textContent = ''
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({
            username: form.username.value,
            password: form.password.value,
          }),
        })
        if (!res.ok) {
          const body = await res.json().catch(() => ({}))
          msg.textContent =
            body.error === 'pending_review'
              ? '账号待管理员审核'
              : body.error === 'disabled'
                ? '账号已被禁用'
                : '用户名或密码错误'
          return
        }
        const { user } = await res.json()
        location.href = user.role === 'admin' ? '/admin.html' : '/desktop.html'
      })
    </script>
  </body>
</html>
