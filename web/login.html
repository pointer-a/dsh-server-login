<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登录 — dsh-server-login</title>
    <link rel="icon" href="/logo.svg" />
    <link rel="stylesheet" href="/design.css" />
  </head>
  <body class="auth-bg">
    <div class="auth-card">
      <div class="auth-brand">
        <img class="logo" src="/logo.svg" alt="logo" />
        <h1>dsh-server-login</h1>
      </div>
      <p class="auth-sub">登录你的 DSH 云桌面</p>

      <form id="login">
        <div class="field">
          <label for="username">用户名</label>
          <input id="username" name="username" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">密码</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </div>
        <button class="btn primary" type="submit">登 录</button>
        <p class="msg" id="msg"></p>
      </form>

      <p class="auth-alt">还没有账号？<a href="/register.html">注册</a></p>
    </div>

    <script>
      const form = document.getElementById('login')
      const msg = document.getElementById('msg')
      form.addEventListener('submit', async (event) => {
        event.preventDefault()
        msg.textContent = ''
        msg.className = 'msg err'
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ username: form.username.value, password: form.password.value }),
        })
        if (!res.ok) {
          const body = await res.json().catch(() => ({}))
          msg.textContent =
            body.error === 'pending_review' ? '账号待管理员审核'
            : body.error === 'disabled' ? '账号已被禁用'
            : '用户名或密码错误'
          return
        }
        location.href = '/desktop.html'
      })
    </script>
  </body>
</html>
