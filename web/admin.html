<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>管理台 — dsh-server-login</title>
    <link rel="stylesheet" href="/design.css" />
  </head>
  <body class="auth-bg">
    <div class="auth-card" style="max-width: 720px">
      <div class="auth-brand">
        <img class="logo" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234d7cfe'/%3E%3Cpath d='M8 9h16l-9 7 9 7H8z' fill='%23fff'/%3E%3C/svg%3E" alt="logo" />
        <h1>管理台</h1>
      </div>
      <p class="auth-sub" id="sub">仅限管理员</p>

      <div id="login" class="hidden">
        <div class="field"><label>用户名</label><input id="username" autocomplete="username" /></div>
        <div class="field"><label>密码</label><input id="password" type="password" autocomplete="current-password" /></div>
        <button class="btn primary" id="loginBtn">登录</button>
        <p class="msg err" id="loginMsg"></p>
      </div>

      <div id="console" class="hidden">
        <div class="row-actions" style="justify-content:space-between">
          <span>登录为 <strong id="who"></strong></span>
          <button class="btn ghost small" id="logoutBtn">退出</button>
        </div>
        <table class="admin">
          <thead><tr><th>用户名</th><th>角色</th><th>注册时间</th><th>操作</th></tr></thead>
          <tbody id="users"></tbody>
        </table>
      </div>
    </div>

    <script>
      const badge = { admin: '管理员', pending: '待审核', active: '正常', disabled: '已禁用' }
      async function me() {
        const res = await fetch('/api/auth/me')
        return res.ok ? (await res.json()).user : null
      }
      async function loadUsers() {
        const { users } = await (await fetch('/api/admin/users')).json()
        const tbody = document.getElementById('users')
        tbody.innerHTML = ''
        for (const u of users) {
          const actions = u.role === 'pending'
            ? `<button class="btn small ghost" data-act="approve" data-id="${u.id}">通过</button>`
            : u.role === 'active' ? `<button class="btn small danger" data-act="disable" data-id="${u.id}">禁用</button>` : ''
          tbody.insertAdjacentHTML('beforeend', `<tr><td>${u.username}</td><td><span class="badge ${u.role}">${badge[u.role] || u.role}</span></td><td>${new Date(u.createdAt).toLocaleString()}</td><td>${actions}</td></tr>`)
        }
        tbody.onclick = async (event) => {
          const btn = event.target.closest('button[data-act]')
          if (!btn) return
          const { act, id } = btn.dataset
          const res = await fetch(`/api/admin/users/${id}/${act}`, { method: 'POST' })
          if (res.ok) await loadUsers()
          else alert('操作失败')
        }
      }
      async function init() {
        const u = await me()
        if (u && u.role === 'admin') {
          document.getElementById('login').classList.add('hidden')
          document.getElementById('console').classList.remove('hidden')
          document.getElementById('who').textContent = u.username
          await loadUsers()
        } else if (u) {
          document.getElementById('sub').textContent = '该账号不是管理员'
        } else {
          document.getElementById('login').classList.remove('hidden')
        }
      }
      document.getElementById('loginBtn').addEventListener('click', async () => {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ username: document.getElementById('username').value, password: document.getElementById('password').value }),
        })
        if (!res.ok) { document.getElementById('loginMsg').textContent = '用户名或密码错误'; return }
        const { user } = await res.json()
        if (user.role !== 'admin') { document.getElementById('loginMsg').textContent = '该账号不是管理员'; return }
        await init()
      })
      document.getElementById('logoutBtn').addEventListener('click', async () => { await fetch('/api/auth/logout', { method: 'POST' }); location.reload() })
      init()
    </script>
  </body>
</html>
