# Phase 0 供应链 CI：构建两个镜像 → 功能冒烟 → Trivy 高危阻断。
#
# 单 job（build-and-scan）：当前 registry 未定，跨 job 传镜像需 docker
# save/upload-artifact，先保持单 job 简化。选定 registry 后再补 push job
# （见 docs/k8s.md §7 Phase 0「CI 接 Trivy」的 push 预留）。
name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install + typecheck
        run: |
          npm ci
          npm run typecheck

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build control-plane image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: dsh-server-login:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build dsh image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dsh
          push: false
          load: true
          tags: dsh:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke — control plane (bootstrap-admin + serve)
        run: |
          # bootstrap-admin as the non-root image user (uid 65532), default data root.
          docker run --rm dsh-server-login:ci bootstrap-admin \
            --username admin --password 'ci-test-pass-123'
          # Boot the server bound to 0.0.0.0 so the host can reach it, then probe.
          docker run --rm -d --name dsh-cp dsh-server-login:ci --host 0.0.0.0 --port 3080
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3080/ >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3080/ >/dev/null
          echo "control plane serving OK"
          docker logs dsh-cp
          docker stop dsh-cp

      - name: Smoke — dsh resolves runtime plugin
        run: |
          # A patch referencing dsh-server-login/runtime must resolve and load:
          # the plugin's apply() logs "[dsh-server-login-runtime] role=...".
          # printf (not a here-doc) so the YAML stays at column 0 inside a
          # literal block scalar.
          printf '%s\n' \
            '- insert:' \
            '    - id: dsh-server-login-runtime' \
            '      name: dsh-server-login/runtime' \
            > /tmp/patch.yml
          docker run --rm -d --name dsh-smoke \
            -v /tmp/patch.yml:/tmp/patch.yml:ro \
            -e DSH_HOME=/tmp/dsh-home \
            dsh:ci --profile web --host 127.0.0.1 --port 8080 --patch /tmp/patch.yml
          sleep 20
          docker logs dsh-smoke | tee /tmp/dsh.log
          grep -q 'dsh-server-login-runtime' /tmp/dsh.log
          echo "runtime plugin resolved OK"
          docker stop dsh-smoke

      - name: Trivy — control plane
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: dsh-server-login:ci
          severity: HIGH,CRITICAL
          exit-code: 1
          # 只阻断「可修复」的高危；收紧为 false 则连不可修复的也拦。
          ignore-unfixed: true

      - name: Trivy — dsh
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: dsh:ci
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true
